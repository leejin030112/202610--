<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediaPipe 손 랜드마크</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0f0f1a;
            font-family: 'Segoe UI', sans-serif;
            color: #e0e0e0;
        }

        h1 {
            margin: 24px 0 16px;
            font-size: 1.6rem;
            font-weight: 600;
            background: linear-gradient(135deg, #6ee7b7, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #status {
            margin-bottom: 16px;
            font-size: 0.95rem;
            color: #94a3b8;
            min-height: 1.4em;
        }

        .video-container {
            position: relative;
            width: 640px;
            height: 480px;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 0 40px rgba(59, 130, 246, 0.15),
                        0 0 80px rgba(110, 231, 183, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        video {
            position: absolute;
            top: 0; left: 0;
            width: 0; height: 0;
            opacity: 0;
            pointer-events: none;
        }

        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        #canvas {
            background: #0f0f1a;
        }

        #drawCanvas {
            z-index: 1;
        }

        .controls {
            margin-top: 16px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .info {
            font-size: 0.85rem;
            color: #64748b;
        }

        #clearBtn {
            padding: 8px 20px;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            font-size: 0.85rem;
            cursor: pointer;
            transition: background 0.2s;
        }
        #clearBtn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        .gesture-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .gesture-badge.drawing {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.3);
        }
        .gesture-badge.paused {
            background: rgba(250, 204, 21, 0.2);
            color: #facc15;
            box-shadow: 0 0 12px rgba(250, 204, 21, 0.3);
        }
        .gesture-badge.idle {
            background: rgba(148, 163, 184, 0.15);
            color: #94a3b8;
        }
    </style>
</head>
<body>

    <h1>✋ MediaPipe 손 랜드마크</h1>
    <p id="status">모델 로딩 중...</p>

    <div class="video-container">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="canvas"></canvas>
        <canvas id="drawCanvas"></canvas>
    </div>

    <div class="controls">
        <button id="clearBtn">🗑 지우기</button>
        <span id="gestureStatus" class="gesture-badge">대기 중</span>
        <p class="info">☝️ 검지 → 스케치 · ✊ 주먹 → 멈춤</p>
    </div>

    <script type="module">
        import {
            FilesetResolver,
            GestureRecognizer
        } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs";

        const video      = document.getElementById("webcam");
        const canvas     = document.getElementById("canvas");
        const ctx        = canvas.getContext("2d");
        const drawCanvas = document.getElementById("drawCanvas");
        const drawCtx    = drawCanvas.getContext("2d");
        const statusEl      = document.getElementById("status");
        const clearBtn      = document.getElementById("clearBtn");
        const gestureBadge  = document.getElementById("gestureStatus");

        // ── 손가락 연결 정보 ──
        const CONNECTIONS = [
            [0,1],[1,2],[2,3],[3,4],           // 엄지
            [0,5],[5,6],[6,7],[7,8],           // 검지
            [5,9],[9,10],[10,11],[11,12],      // 중지
            [9,13],[13,14],[14,15],[15,16],    // 약지
            [13,17],[17,18],[18,19],[19,20],   // 소지
            [0,17]                              // 손바닥
        ];

        // ── 색상 팔레트 (손 별로 다른 색) ──
        const PALETTE = [
            { line: "#6ee7b7", dot: "#ffffff" },
            { line: "#818cf8", dot: "#fbbf24" }
        ];

        // ── 스케치 상태 ──
        let prevPoint = null;       // 이전 프레임의 스무딩된 좌표
        let isDrawing = false;      // 현재 Pointing_Up 상태인지
        let isPaused  = false;      // Closed_Fist로 멈춤 상태인지
        const smoothBuffer = [];    // 최근 좌표 버퍼 (이동 평균용)
        const SMOOTH_SIZE  = 5;     // 버퍼 크기

        function smoothPoint(x, y) {
            smoothBuffer.push({ x, y });
            if (smoothBuffer.length > SMOOTH_SIZE) smoothBuffer.shift();
            const avg = smoothBuffer.reduce(
                (acc, p) => ({ x: acc.x + p.x, y: acc.y + p.y }),
                { x: 0, y: 0 }
            );
            return {
                x: avg.x / smoothBuffer.length,
                y: avg.y / smoothBuffer.length
            };
        }

        let gestureRecognizer;

        // ── 지우기 버튼 ──
        clearBtn.addEventListener("click", () => {
            drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
        });

        // ── 1. 모델 초기화 (GestureRecognizer) ──
        async function init() {
            const vision = await FilesetResolver.forVisionTasks(
                "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
            );

            gestureRecognizer = await GestureRecognizer.createFromOptions(vision, {
                baseOptions: {
                    modelAssetPath:
                        "https://storage.googleapis.com/mediapipe-models/gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task",
                    delegate: "GPU"
                },
                runningMode: "VIDEO",
                numHands: 2
            });

            statusEl.textContent = "웹캠 연결 중...";
            startCamera();
        }

        // ── 2. 웹캠 시작 ──
        function startCamera() {
            navigator.mediaDevices
                .getUserMedia({ video: { width: 640, height: 480 } })
                .then(stream => {
                    video.srcObject = stream;
                    video.addEventListener("loadeddata", () => {
                        canvas.width      = video.videoWidth;
                        canvas.height     = video.videoHeight;
                        drawCanvas.width  = video.videoWidth;
                        drawCanvas.height = video.videoHeight;

                        // 드로잉 캔버스 초기 설정
                        drawCtx.strokeStyle = "#ef4444";
                        drawCtx.lineWidth   = 20;
                        drawCtx.lineCap     = "round";
                        drawCtx.lineJoin    = "round";

                        statusEl.textContent = "";
                        detect();
                    });
                })
                .catch(() => {
                    statusEl.textContent = "⚠ 웹캠 접근이 거부되었습니다.";
                });
        }

        // ── 3. 프레임별 감지 ──
        function detect() {
            const results = gestureRecognizer.recognizeForVideo(video, performance.now());
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            let pointingNow = false;
            let fistNow     = false;

            if (results.landmarks && results.landmarks.length > 0) {
                results.landmarks.forEach((lm, idx) => {
                    const color = PALETTE[idx % PALETTE.length];
                    drawConnectors(lm, color.line);
                    drawDots(lm, color.dot);
                });

                // 첫 번째 손의 제스처 확인
                if (results.gestures && results.gestures.length > 0) {
                    const gesture = results.gestures[0][0];
                    const name = gesture.categoryName;

                    if (name === "Pointing_Up") {
                        pointingNow = true;
                        const tip = results.landmarks[0][8]; // 검지 끝 (index finger tip)
                        const rawX = tip.x * drawCanvas.width;
                        const rawY = tip.y * drawCanvas.height;
                        const pt = smoothPoint(rawX, rawY);

                        if (isDrawing && prevPoint) {
                            // 이전 점과 현재 점의 중간점을 사용한 부드러운 곡선
                            const midX = (prevPoint.x + pt.x) / 2;
                            const midY = (prevPoint.y + pt.y) / 2;
                            drawCtx.beginPath();
                            drawCtx.moveTo(prevPoint.x, prevPoint.y);
                            drawCtx.quadraticCurveTo(prevPoint.x, prevPoint.y, midX, midY);
                            drawCtx.stroke();
                        }

                        prevPoint = { x: pt.x, y: pt.y };
                    } else if (name === "Closed_Fist") {
                        fistNow = true;
                        drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
                    }
                }
            }

            // 상태 업데이트
            isDrawing = pointingNow;
            isPaused  = fistNow;

            if (!pointingNow) {
                prevPoint = null;
                smoothBuffer.length = 0;  // 버퍼 초기화
            }

            // 상태 배지 업데이트
            if (pointingNow) {
                gestureBadge.textContent = "✏️ 스케치 중";
                gestureBadge.className   = "gesture-badge drawing";
            } else if (fistNow) {
                gestureBadge.textContent = "✊ 멈춤";
                gestureBadge.className   = "gesture-badge paused";
            } else {
                gestureBadge.textContent = "대기 중";
                gestureBadge.className   = "gesture-badge idle";
            }

            requestAnimationFrame(detect);
        }

        // ── 그리기 헬퍼 ──
        function drawConnectors(lm, color) {
            ctx.strokeStyle = color;
            ctx.lineWidth   = 3;
            ctx.lineJoin    = "round";

            for (const [a, b] of CONNECTIONS) {
                ctx.beginPath();
                ctx.moveTo(lm[a].x * canvas.width, lm[a].y * canvas.height);
                ctx.lineTo(lm[b].x * canvas.width, lm[b].y * canvas.height);
                ctx.stroke();
            }
        }

        function drawDots(lm, color) {
            ctx.fillStyle = color;
            for (const pt of lm) {
                ctx.beginPath();
                ctx.arc(pt.x * canvas.width, pt.y * canvas.height, 5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ── 실행 ──
        init();
    </script>
</body>
</html>
